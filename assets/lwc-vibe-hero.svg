<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="LWC — vibe. AI writes. You decide. LWC verifies.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#132238"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0.55"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1E3A5F" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="24" fill="url(#grid)" opacity="0.6"/>

  <!-- Radar on the right -->
  <g transform="translate(930 210)">
    <circle r="170" fill="url(#glow)"/>
    <circle r="150" fill="none" stroke="#2DD4BF" stroke-opacity="0.35" stroke-width="1.5"/>
    <circle r="110" fill="none" stroke="#2DD4BF" stroke-opacity="0.35" stroke-width="1.5"/>
    <circle r="70" fill="none" stroke="#2DD4BF" stroke-opacity="0.35" stroke-width="1.5"/>
    <circle r="30" fill="none" stroke="#2DD4BF" stroke-opacity="0.35" stroke-width="1.5"/>
    <line x1="-150" y1="0" x2="150" y2="0" stroke="#2DD4BF" stroke-opacity="0.25"/>
    <line x1="0" y1="-150" x2="0" y2="150" stroke="#2DD4BF" stroke-opacity="0.25"/>
    <path d="M0 0 L150 0 A150 150 0 0 0 46 -143 Z" fill="url(#sweep)"/>
    <line x1="0" y1="0" x2="46" y2="-143" stroke="#5EEAD4" stroke-width="2"/>
    <circle r="4" fill="#5EEAD4"/>
    <g>
      <circle cx="-62" cy="-48" r="7" fill="#F59E0B"/>
      <circle cx="-62" cy="-48" r="13" fill="none" stroke="#F59E0B" stroke-opacity="0.5"/>
      <circle cx="88" cy="54" r="7" fill="#EF4444"/>
      <circle cx="88" cy="54" r="13" fill="none" stroke="#EF4444" stroke-opacity="0.5"/>
      <circle cx="-30" cy="96" r="6" fill="#38BDF8"/>
      <circle cx="104" cy="-92" r="6" fill="#A3E635"/>
    </g>
    <text x="-62" y="-66" font-family="Segoe UI, Inter, Roboto, Arial, sans-serif" font-size="12" fill="#FCD34D" text-anchor="middle">REQ-001</text>
    <text x="88" y="78" font-family="Segoe UI, Inter, Roboto, Arial, sans-serif" font-size="12" fill="#FCA5A5" text-anchor="middle">SEC-002</text>
    <text x="-30" y="118" font-family="Segoe UI, Inter, Roboto, Arial, sans-serif" font-size="12" fill="#7DD3FC" text-anchor="middle">PROC-005</text>
    <text x="104" y="-106" font-family="Segoe UI, Inter, Roboto, Arial, sans-serif" font-size="12" fill="#BEF264" text-anchor="middle">ARCH-001</text>
  </g>

  <!-- Text on the left -->
  <g font-family="Segoe UI, Inter, Roboto, Arial, sans-serif">
    <rect x="64" y="60" width="118" height="28" rx="14" fill="#0F766E"/>
    <text x="123" y="79" font-size="14" font-weight="600" fill="#ECFEFF" text-anchor="middle" letter-spacing="1">OPEN SOURCE</text>
    <text x="64" y="160" font-size="72" font-weight="700" fill="#F8FAFC" letter-spacing="-1">LWC <tspan fill="#2DD4BF">—</tspan> vibe</text>
    <text x="64" y="196" font-size="20" fill="#94A3B8">Local Workflow Coach · a local AI-development coach</text>
    <text x="64" y="258" font-size="30" font-weight="600" fill="#E2E8F0">AI writes. <tspan fill="#FCD34D">You decide.</tspan> <tspan fill="#5EEAD4">LWC verifies.</tspan></text>
    <text x="64" y="292" font-size="17" fill="#94A3B8">ИИ пишет. Ты решаешь. LWC проверяет. · AI жазады. Сен шешесің. LWC тексереді.</text>
    <g transform="translate(64 330)" font-size="14" fill="#CBD5E1">
      <rect x="0" y="0" width="180" height="32" rx="8" fill="#1E293B" stroke="#334155"/>
      <text x="90" y="21" text-anchor="middle">Anomaly Radar · 5 categories</text>
      <rect x="192" y="0" width="150" height="32" rx="8" fill="#1E293B" stroke="#334155"/>
      <text x="267" y="21" text-anchor="middle">Claude Code plugin</text>
      <rect x="354" y="0" width="118" height="32" rx="8" fill="#1E293B" stroke="#334155"/>
      <text x="413" y="21" text-anchor="middle">EN · RU · KK</text>
      <rect x="484" y="0" width="150" height="32" rx="8" fill="#1E293B" stroke="#334155"/>
      <text x="559" y="21" text-anchor="middle">0 dependencies</text>
    </g>
  </g>
</svg>
