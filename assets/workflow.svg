<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="LWC — vibe workflow: Learn, Design, Build, Review with checkpoints and evidence">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#475569"/>
    </marker>
    <marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#B45309"/>
    </marker>
    <style>
      .t { font-family: "Segoe UI", Inter, Roboto, Arial, sans-serif; fill: #0F172A; }
      .s { font-size: 13px; fill: #475569; }
      .m { font-size: 12.5px; font-family: Consolas, "Cascadia Mono", Menlo, monospace; fill: #0F172A; }
      .stage { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; }
      .ln { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#a); }
      .back { stroke: #B45309; stroke-width: 1.8; fill: none; marker-end: url(#aR); stroke-dasharray: 5 4; }
      .cp { fill: #FFFBEB; stroke: #D97706; stroke-width: 1.5; }
      .ev { fill: #ECFDF5; stroke: #0F766E; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="1200" height="560" fill="#F8FAFC" rx="20"/>
  <text x="40" y="46" class="t" font-size="26" font-weight="700">Workflow: AI writes, you decide, LWC verifies</text>
  <text x="40" y="70" class="t s">The task stage lives in .lwc/session.json. Moving to code is possible only after the user confirms the decisions.</text>

  <!-- Stages -->
  <g>
    <rect x="40" y="110" width="250" height="150" rx="14" class="stage"/>
    <text x="60" y="140" class="t" font-size="18" font-weight="700">1 · Learn</text>
    <text x="60" y="162" class="t s">clarify requirements, inspect</text>
    <text x="60" y="180" class="t s">the project, build the map</text>
    <text x="60" y="208" class="t m">lwc init · lwc task start</text>
    <text x="60" y="226" class="t m">lwc map</text>
    <text x="60" y="248" class="t s" fill="#B45309">no code is written</text>

    <rect x="330" y="110" width="250" height="150" rx="14" class="stage"/>
    <text x="350" y="140" class="t" font-size="18" font-weight="700">2 · Design</text>
    <text x="350" y="162" class="t s">options, risks, scope,</text>
    <text x="350" y="180" class="t s">decisions → confirmation</text>
    <text x="350" y="208" class="t m">lwc radar --category a</text>
    <text x="350" y="226" class="t m">lwc decision add / confirm</text>
    <text x="350" y="248" class="t s" fill="#B45309">no code · guard: ask</text>

    <rect x="620" y="110" width="250" height="150" rx="14" class="stage" stroke="#0F766E" stroke-width="2"/>
    <text x="640" y="140" class="t" font-size="18" font-weight="700">3 · Build</text>
    <text x="640" y="162" class="t s">small steps within the task scope,</text>
    <text x="640" y="180" class="t s">tests, recorded runs</text>
    <text x="640" y="208" class="t m">lwc task stage build</text>
    <text x="640" y="226" class="t m">lwc run -- npm test</text>
    <text x="640" y="248" class="t s" fill="#0F766E">code is written · evidence</text>

    <rect x="910" y="110" width="250" height="150" rx="14" class="stage"/>
    <text x="930" y="140" class="t" font-size="18" font-weight="700">4 · Review</text>
    <text x="930" y="162" class="t s">diff against the plan, radar,</text>
    <text x="930" y="180" class="t s">walking through findings, acceptance</text>
    <text x="930" y="208" class="t m">lwc radar --run-tests</text>
    <text x="930" y="226" class="t m">lwc suppress … --reason</text>
    <text x="930" y="248" class="t s">accept / rework / revert</text>
  </g>
  <path d="M290 185 L330 185" class="ln"/>
  <path d="M580 185 L620 185" class="ln"/>
  <path d="M870 185 L910 185" class="ln"/>
  <path d="M1035 260 L1035 300 L745 300 L745 260" class="back"/>
  <text x="820" y="294" class="t s" fill="#B45309">rework → back to Build</text>

  <!-- Checkpoints -->
  <g>
    <rect x="40" y="330" width="1120" height="92" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="60" y="356" class="t" font-size="15" font-weight="700">✦ Checkpoints (confirmed only by the user)</text>
    <text x="1140" y="356" class="t s" text-anchor="end">explanation levels: beginner · intermediate · advanced</text>
    <rect x="60" y="370" width="176" height="36" rx="8" class="cp"/>
    <text x="148" y="393" class="t" font-size="12.5" text-anchor="middle">Requirements — what / on error</text>
    <rect x="248" y="370" width="176" height="36" rx="8" class="cp"/>
    <text x="336" y="393" class="t" font-size="12.5" text-anchor="middle">Approach — reasoning</text>
    <rect x="436" y="370" width="176" height="36" rx="8" class="cp"/>
    <text x="524" y="393" class="t" font-size="12.5" text-anchor="middle">Design — decision recorded</text>
    <rect x="624" y="370" width="176" height="36" rx="8" class="cp"/>
    <text x="712" y="393" class="t" font-size="12.5" text-anchor="middle">Implementation — step files</text>
    <rect x="812" y="370" width="176" height="36" rx="8" class="cp"/>
    <text x="900" y="393" class="t" font-size="12.5" text-anchor="middle">Verification — accept?</text>
    <text x="1150" y="393" class="t s" text-anchor="end">light · normal · frequent</text>
  </g>

  <!-- Evidence -->
  <g>
    <rect x="40" y="440" width="1120" height="92" rx="14" class="ev"/>
    <text x="60" y="466" class="t" font-size="15" font-weight="700">Evidence instead of words</text>
    <text x="60" y="490" class="t s">lwc run records the command, exit code and output hash in .lwc/evidence/. lwc claim records the agent's claim.</text>
    <text x="60" y="510" class="t s">The radar checks: "tests pass" without a run → PROC-002; success after failure → PROC-005; code before agreement → PROC-001; file outside scope → PROC-003.</text>
  </g>
</svg>
